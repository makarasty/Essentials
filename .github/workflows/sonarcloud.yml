name: SonarCloud Analysis

on:
  push:
    branches: [ main ]

jobs:
  sonarcloud:
    name: Build, Test and Scan
    runs-on: ubuntu-latest
    env:
      # Read here rather than only on the step: a step's `if` cannot see the secrets context, but it
      # can see env, which is how the scan below asks whether a token exists at all.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and Run Tests
        run: ./gradlew build

      - name: SonarCloud Scan via Action
        # Skipped where there is no token. This fork has no SonarCloud project of its own, and the
        # scanner answers that by failing the whole workflow on every push to main - which also
        # throws away the build and the tests above, the part of this job that does work here.
        #
        # The organization and project key below are still upstream's. A token alone will not make
        # this pass: whoever sets SONAR_TOKEN has to point these two at the project it belongs to.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kieaer
            -Dsonar.projectKey=Kieaer_Essentials
            -Dsonar.sources=Essential/src/main/kotlin
            -Dsonar.tests=Essential/src/test/kotlin
            -Dsonar.java.binaries=Essential/build/classes/kotlin/main
            -Dsonar.coverage.jacoco.xmlReportPaths=Essential/build/reports/jacoco/test/jacocoTestReport.xml