name: Upstream watch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    # Fails - and so mails the repository owner - only while Kieaer/Essentials has commits this fork has not
    # merged. Issues are switched off on this fork, so a failed run is the notification.
    - name: Compare with upstream
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        ahead=$(gh api "repos/$GH_REPO/compare/main...Kieaer:main" --jq .ahead_by)
        [ "$ahead" -eq 0 ] && { echo "Upstream is merged."; exit 0; }
        release=$(gh api repos/Kieaer/Essentials/releases/latest --jq .tag_name)
        echo "::error::Kieaer/Essentials main has $ahead commits not in this fork (latest release $release): https://github.com/$GH_REPO/compare/main...Kieaer:Essentials:main"
        exit 1
